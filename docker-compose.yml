version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: meetsync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: meetsync-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: meetsync-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/meetsync
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
